<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560"><rect x="0" y="0" width="1280" height="560" rx="18" fill="#0B1220"/><text x="48.0" y="52.0" font-family="Segoe UI, Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#94A3B8" fill-opacity="1" text-anchor="start" letter-spacing="2">VOLUME ANALYSER · ZONE EXHAUSTION</text><text x="48.0" y="86.0" font-family="Segoe UI, Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#E5E7EB" fill-opacity="1" text-anchor="start" letter-spacing="0">Every liquidity zone carries its own order-flow footprint</text><text x="48.0" y="114.0" font-family="Segoe UI, Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#94A3B8" fill-opacity="1" text-anchor="start" letter-spacing="0">Each zone is split into four quarters. Volume traded inside a quarter is added to it, with an estimated buy/sell delta.</text><rect x="70.0" y="397.0" width="550.0" height="71.0" rx="0" fill="#F23645" fill-opacity="0.2837209302325582" stroke="#F23645" stroke-width="0.8" stroke-opacity="0.5"/><text x="604.0" y="438.5" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="17" font-weight="700" fill="#F23645" fill-opacity="1" text-anchor="end" letter-spacing="0">-6.4K</text><text x="86.0" y="437.5" font-family="Segoe UI, Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#94A3B8" fill-opacity="1" text-anchor="start" letter-spacing="0">Q1</text><rect x="70.0" y="322.0" width="550.0" height="71.0" rx="0" fill="#089981" fill-opacity="0.49860465116279074" stroke="#F23645" stroke-width="0.8" stroke-opacity="0.5"/><text x="604.0" y="363.5" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="17" font-weight="700" fill="#089981" fill-opacity="1" text-anchor="end" letter-spacing="0">+14.8K</text><text x="86.0" y="362.5" font-family="Segoe UI, Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#94A3B8" fill-opacity="1" text-anchor="start" letter-spacing="0">Q2</text><rect x="70.0" y="247.0" width="550.0" height="71.0" rx="0" fill="#089981" fill-opacity="0.19930232558139538" stroke="#F23645" stroke-width="0.8" stroke-opacity="0.5"/><text x="604.0" y="288.5" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="17" font-weight="700" fill="#089981" fill-opacity="1" text-anchor="end" letter-spacing="0">+3.1K</text><text x="86.0" y="287.5" font-family="Segoe UI, Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#94A3B8" fill-opacity="1" text-anchor="start" letter-spacing="0">Q3</text><rect x="70.0" y="172.0" width="550.0" height="71.0" rx="0" fill="#F23645" fill-opacity="0.67" stroke="#F23645" stroke-width="0.8" stroke-opacity="0.5"/><text x="604.0" y="213.5" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="17" font-weight="700" fill="#F23645" fill-opacity="1" text-anchor="end" letter-spacing="0">-21.5K</text><text x="86.0" y="212.5" font-family="Segoe UI, Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#94A3B8" fill-opacity="1" text-anchor="start" letter-spacing="0">Q4</text><rect x="70.0" y="170.0" width="550.0" height="300.0" rx="2" fill="none" fill-opacity="1" stroke="#A855F7" stroke-width="2.2" /><rect x="630.0" y="304.0" width="70.0" height="32.0" rx="6" fill="#F23645" fill-opacity="0.22" stroke="#F23645" stroke-width="1" /><text x="665.0" y="326.0" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="16" font-weight="800" fill="#E5E7EB" fill-opacity="1" text-anchor="middle" letter-spacing="0">41%</text><rect x="300.0" y="140.0" width="26.0" height="22.0" rx="4" fill="#A855F7" fill-opacity="1" stroke="none" stroke-width="1" /><text x="313.0" y="156.0" font-family="Segoe UI, Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" fill-opacity="1" text-anchor="middle" letter-spacing="0">M</text><text x="70.0" y="502.0" font-family="Segoe UI, Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#94A3B8" fill-opacity="1" text-anchor="start" letter-spacing="0">Buy-side liquidity zone · Macro level · from pivot high to candle body</text><rect x="760.0" y="146.0" width="470.0" height="80.0" rx="12" fill="#111827" fill-opacity="1" stroke="#334155" stroke-width="1" /><rect x="760.0" y="146.0" width="4.0" height="80.0" rx="2" fill="#A855F7" fill-opacity="1" stroke="none" stroke-width="1" /><text x="782.0" y="170.0" font-family="Segoe UI, Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#A855F7" fill-opacity="1" text-anchor="start" letter-spacing="0">Level tag</text><text x="782.0" y="194.0" font-family="Segoe UI, Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94A3B8" fill-opacity="1" text-anchor="start" letter-spacing="0">M = Macro (structural) · L = Local (intraday) · μ = Micro </text><text x="782.0" y="212.0" font-family="Segoe UI, Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94A3B8" fill-opacity="1" text-anchor="start" letter-spacing="0">(execution). Sits on the bar where the pivot was confirmed. </text><rect x="760.0" y="238.0" width="470.0" height="80.0" rx="12" fill="#111827" fill-opacity="1" stroke="#334155" stroke-width="1" /><rect x="760.0" y="238.0" width="4.0" height="80.0" rx="2" fill="#089981" fill-opacity="1" stroke="none" stroke-width="1" /><text x="782.0" y="262.0" font-family="Segoe UI, Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#089981" fill-opacity="1" text-anchor="start" letter-spacing="0">Delta per quarter</text><text x="782.0" y="286.0" font-family="Segoe UI, Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94A3B8" fill-opacity="1" text-anchor="start" letter-spacing="0">Green = buyers dominated that price band, red = sellers. </text><text x="782.0" y="304.0" font-family="Segoe UI, Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94A3B8" fill-opacity="1" text-anchor="start" letter-spacing="0">Brighter = more volume. Estimated from candle data. </text><rect x="760.0" y="330.0" width="470.0" height="80.0" rx="12" fill="#111827" fill-opacity="1" stroke="#334155" stroke-width="1" /><rect x="760.0" y="330.0" width="4.0" height="80.0" rx="2" fill="#FACC15" fill-opacity="1" stroke="none" stroke-width="1" /><text x="782.0" y="354.0" font-family="Segoe UI, Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#FACC15" fill-opacity="1" text-anchor="start" letter-spacing="0">Zone exhaustion</text><text x="782.0" y="378.0" font-family="Segoe UI, Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94A3B8" fill-opacity="1" text-anchor="start" letter-spacing="0">Health = 100% − volume absorbed ÷ zone capacity. Below 30% the </text><text x="782.0" y="396.0" font-family="Segoe UI, Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94A3B8" fill-opacity="1" text-anchor="start" letter-spacing="0">label turns gold: the level is being used up. </text><rect x="760.0" y="422.0" width="470.0" height="80.0" rx="12" fill="#111827" fill-opacity="1" stroke="#334155" stroke-width="1" /><rect x="760.0" y="422.0" width="4.0" height="80.0" rx="2" fill="#F23645" fill-opacity="1" stroke="none" stroke-width="1" /><text x="782.0" y="446.0" font-family="Segoe UI, Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#F23645" fill-opacity="1" text-anchor="start" letter-spacing="0">Swept</text><text x="782.0" y="470.0" font-family="Segoe UI, Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94A3B8" fill-opacity="1" text-anchor="start" letter-spacing="0">Price trades through the zone: it turns dashed and stops </text><text x="782.0" y="488.0" font-family="Segoe UI, Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94A3B8" fill-opacity="1" text-anchor="start" letter-spacing="0">absorbing. Fresh sweeps feed the context score. </text><rect x="70.0" y="514.0" width="54.0" height="22.0" rx="5" fill="#089981" fill-opacity="0.2" stroke="#089981" stroke-width="1" /><text x="97.0" y="530.0" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#E5E7EB" fill-opacity="1" text-anchor="middle" letter-spacing="0">100%</text><text x="132.0" y="530.0" font-family="Segoe UI, Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94A3B8" fill-opacity="1" text-anchor="start" letter-spacing="0">fresh</text><rect x="210.0" y="514.0" width="54.0" height="22.0" rx="5" fill="#089981" fill-opacity="0.2" stroke="#089981" stroke-width="1" /><text x="237.0" y="530.0" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#E5E7EB" fill-opacity="1" text-anchor="middle" letter-spacing="0">71%</text><text x="272.0" y="530.0" font-family="Segoe UI, Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94A3B8" fill-opacity="1" text-anchor="start" letter-spacing="0">tested</text><rect x="350.0" y="514.0" width="54.0" height="22.0" rx="5" fill="#FACC15" fill-opacity="0.2" stroke="#FACC15" stroke-width="1" /><text x="377.0" y="530.0" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#E5E7EB" fill-opacity="1" text-anchor="middle" letter-spacing="0">24%</text><text x="412.0" y="530.0" font-family="Segoe UI, Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94A3B8" fill-opacity="1" text-anchor="start" letter-spacing="0">exhausted</text><rect x="490.0" y="514.0" width="54.0" height="22.0" rx="5" fill="#64748B" fill-opacity="0.2" stroke="#64748B" stroke-width="1" stroke-dasharray="4 3" /><text x="517.0" y="530.0" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#E5E7EB" fill-opacity="1" text-anchor="middle" letter-spacing="0">—</text><text x="552.0" y="530.0" font-family="Segoe UI, Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94A3B8" fill-opacity="1" text-anchor="start" letter-spacing="0">swept</text></svg>